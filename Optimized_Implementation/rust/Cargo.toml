[package]
name = "less"
version = "0.1.0"
edition = "2024"

#[target.'cfg(target_arch="x86_64")']
## x86-64-v2 does not have AVX2, but we need that.
## x86-64-v4 has AVX512 which we explicitly do not include for portability.
#rustflags = ["-C", "target-cpu=x86-64-v3"]

#[target.'cfg(all(target_arch="aarch64", target_os="macos"))']
# For aarch64 macos builds, specifically target M1 rather than generic aarch64.
#rustflags = ["-C", "target-cpu=apple-a14"]


[features]
default = ["cat1_192"]

# categories, implied by the optimization corners below
cat1 = []
cat3 = []
cat5 = []

# optimization corners, exactly one must be enabled
cat1_192 = ["cat1"]
cat1_68  = ["cat1"]
cat1_45  = ["cat1"]
cat3_220 = ["cat3"]
cat3_102 = ["cat3"]
cat5_345 = ["cat5"]
cat5_137 = ["cat5"]

[dependencies]
sha3 = "0.10.9"
num-traits = "0.2.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
#target-feature = "avx2"
